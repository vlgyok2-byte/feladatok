            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: #161623;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #2a2a40;
        }
        h1 { color: #00d2ff; margin-top: 0; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #b0b0d0;
            background: #1f1f38;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .timer-bar-container {
            width: 100%;
            height: 12px;
            background: #252542;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ff87);
            transition: width 1s linear, background 0.5s;
        }
        .question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 60px;
            line-height: 1.4;
        }
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media(max-width: 480px) {
            .answers-grid { grid-template-columns: 1fr; }
        }
        .btn {
            background: #252542;
            color: white;
            border: 2px solid #3d3d66;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:hover:not(:disabled) {
            background: #3d3d66;
            border-color: #00d2ff;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn.correct { background: #00ff87 !important; color: #121212; border-color: #00ff87; font-weight: bold; }
        .btn.wrong { background: #ff3838 !important; color: white; border-color: #ff3838; }
        .screen { display: none; }
        .screen.active { display: block; }
        .result-screen h2 { color: #00ff87; }
        .grade-badge {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            background: #1f1f38;
            color: #00d2ff;
            border: 1px solid #00d2ff;
        }
        .action-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        .primary-btn {
            background: #00d2ff;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .primary-btn:hover { background: #00b4db; }
        .secondary-btn {
            background: transparent;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

    </style>
</head>

            <button class="btn" id="btn-2" onclick="checkAnswer(2)"></button>
            <button class="btn" id="btn-3" onclick="checkAnswer(3)"></button>
        </div>
    </div>

    <div id="correct-screen" class="screen">

        <p id="correct-msg"></p>
        <div class="action-btns">

            <button class="secondary-btn" onclick="endGame(true)">Megállok és kérem a jegyet</button>
        </div>
    </div>

    <!-- Kiértékelés Képernyő -->

</div>

let currentQuestions = [];
let currentIndex = 0;
let correctAnswersCount = 0;
let timeLeft = 35;
let timerInterval = null;

// Segédfunkció tömbök véletlenszerű megkeverésére (Fisher-Yates)
function shuffle(array) {
    let newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

function calculateGrade(correctCount, totalCount) {
    const percentage = Math.round((correctCount / totalCount) * 100);
    let gradeName = "";
    let gradeNum = 1;

    if (percentage <= 40) {
        gradeName = "Elégtelen";
        gradeNum = 1;
    } else if (percentage <= 55) {
        gradeName = "Elégséges";
        gradeNum = 2;
    } else if (percentage <= 70) {
        gradeName = "Közepes";
        gradeNum = 3;
    } else if (percentage <= 85) {
        gradeName = "Jó";
        gradeNum = 4;
    } else {
        gradeName = "Jeles";
        gradeNum = 5;
    }

    return { percentage, gradeName, gradeNum };
}

function initGame() {
    // 1. Kérdésbank véletlenszerű megkeverése
    let shuffledBank = shuffle(questionBank);
    
    // 2. Első 15 kérdés kiválasztása
    currentQuestions = shuffledBank.slice(0, 15);
    
    currentIndex = 0;
    correctAnswersCount = 0;
    
    showScreen('game-screen');
    loadQuestion();
}

function loadQuestion() {
    if (currentIndex >= currentQuestions.length) {
        endGame(false);
        return;
    }
    
    clearInterval(timerInterval);
    timeLeft = 35;
    updateTimerDisplay();
    
    const qData = currentQuestions[currentIndex];
    
    // Felület frissítése
    document.getElementById('question-counter').innerText = `Kérdés: ${currentIndex + 1}/${currentQuestions.length}`;
    document.getElementById('score-counter').innerText = `Helyes válaszok: ${correctAnswersCount}`;
    document.getElementById('question-text').innerText = qData.q;
    
    // Gombok beállítása
    for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`btn-${i}`);
        btn.innerText = qData.a[i];
        btn.className = "btn";
        btn.disabled = false;
    }
    
    showScreen('game-screen');
    
    // Időzítő indítása
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timeOut();
        }
    }, 1000);
}

function updateTimerDisplay() {
    document.getElementById('timer-text').innerText = `Idő: ${timeLeft} mp`;
    const percentage = (timeLeft / 35) * 100;
    const bar = document.getElementById('timer-bar');
    bar.style.width = `${percentage}%`;
    
    if (timeLeft <= 5) {
        bar.style.background = '#ff3838';
    } else if (timeLeft <= 8) {
        bar.style.background = '#ff9f43';
    } else {
        bar.style.background = 'linear-gradient(90deg, #00d2ff, #00ff87)';
    }
}

function checkAnswer(selectedIndex) {
    clearInterval(timerInterval);
    const qData = currentQuestions[currentIndex];
    
    for (let i = 0; i < 4; i++) {
        document.getElementById(`btn-${i}`).disabled = true;
    }
    
    if (selectedIndex === qData.correct) {
        document.getElementById(`btn-${selectedIndex}`).classList.add('correct');
        correctAnswersCount++;
        
        setTimeout(() => {
            const currentEval = calculateGrade(correctAnswersCount, currentQuestions.length);
            document.getElementById('correct-msg').innerText = `Jelenlegi eredményed: ${correctAnswersCount}/${currentQuestions.length} pont (${currentEval.percentage}%) - Várható érdemjegy: ${currentEval.gradeName} (${currentEval.gradeNum})`;
            showScreen('correct-screen');
        }, 1000);
    } else {
        document.getElementById(`btn-${selectedIndex}`).classList.add('wrong');
        document.getElementById(`btn-${qData.correct}`).classList.add('correct');
        
        setTimeout(() => {
            handleLoss();
        }, 1500);
    }
}

function timeOut() {
    for (let i = 0; i < 4; i++) {
        document.getElementById(`btn-${i}`).disabled = true;
    }
    const qData = currentQuestions[currentIndex];
    document.getElementById(`btn-${qData.correct}`).classList.add('correct');
    
    alert("Lejárt az időd!");
    setTimeout(() => {
        handleLoss();
    }, 1500);
}

function handleLoss() {
    const total = currentQuestions.length;
    const evalData = calculateGrade(correctAnswersCount, total);
    
    document.getElementById('grade-container').innerText = `Érdemjegy: ${evalData.gradeName} (${evalData.gradeNum})`;
    document.getElementById('result-text').innerText = `Sajnos hibáztál vagy lejárt az időd! Elért eredményed: ${correctAnswersCount}/${total} helyes válasz (${evalData.percentage}%).`;
    showScreen('result-screen');
}

function nextQuestion() {
    currentIndex++;
    loadQuestion();
}

function endGame(stoppedByUser) {
    clearInterval(timerInterval);
    const total = currentQuestions.length;
    const evalData = calculateGrade(correctAnswersCount, total);
    
    document.getElementById('grade-container').innerText = `Érdemjegy: ${evalData.gradeName} (${evalData.gradeNum})`;
    
    if (stoppedByUser) {
        document.getElementById('result-text').innerText = `Időben megálltál. Elért eredményed: ${correctAnswersCount}/${total} helyes válasz (${evalData.percentage}%).`;
    } else {
        document.getElementById('result-text').innerText = `Gratulálunk, befejezted a tesztet! Elért eredményed: ${correctAnswersCount}/${total} helyes válasz (${evalData.percentage}%).`;
    }
    showScreen('result-screen');
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

window.onload = initGame;
